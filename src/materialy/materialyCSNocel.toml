schema_version = "1.0.0"

# materiály: ocel dle normy ČSN
# Kde E je první doplňková číslice (stav materiálu) a F je druhá doplňková číslice (stupeň převálcování nebo zpracování).

# 1. První doplňková číslice „E“ (Stav materiálu / Tepelné zpracování)Tato číslice definuje, v jakém stavu tepelného zpracování je hutní materiál dodáván.ČísliceVýznam 
# (Stav materiálu)
# 1x xxx.0x - tepelně nezpracovaný
# 1x xxx.1x - normalizačně žíhaný
# 1x xxx.2x - žíhaný (s blíže určeným způsobem žíhání, např. na odstranění pnutí)
# 1x xxx.3x - žíhaný na měkko (časté u nástrojových ocelí pro snazší obrábění)
# 1x xxx.4x - kalený nebo kalený a popuštěný při nízkých teplotách, po rozpoušťěcím žhání (jen u austenitických ocelí)
# 1x xxx.5x - normalizačně žíhaný a popuštěný
# 1x xxx.6x - zušlechtěný na dolní pevnost (obvyklou u dané oceli)
# 1x xxx.7x - zušlechtěný na střední pevnost (obvyklou u dané oceli)
# 1x xxx.8x - zušlechtěný na horní pevnost (obvyklou u dané oceli)
# 1x xxx.9x - stav podle zvláštního ujednání (stavy, které nelze popsat čísly 0 až 8)

# 2. Druhá doplňková číslice „F“ (Stupeň přetváření za studena)Pokud za tečkou následuje i druhá číslice, vyjadřuje nejčastěji stupeň zpevnění nebo převálcování za studena (typické pro plechy, pásy nebo dráty).ČísliceVýznam (Stupeň zpevnění)
# 1x xxx.x0 - dále nepřeválcováno 
# 1x xxx.x1 - lehce převálcovaný
# 1x xxx.x2 - 1/4 tvrdý
# 1x xxx.x3 - 1/2 tvrdý
# 1x xxx.x4 - 3/4 tvrdý
# 1x xxx.x5 - 4/4 tvrdý
# 1x xxx.x6 - 5/4 tvrdý
# 1x xxx.x7 - netvoří se při něm čtyřlístky (pásy jsou zpracovány se zřetelem na omezení anizotropie mechanických vlastností materiálů - omezení tvorby cípů): mechanické vlastnosti jako u měkce žíhaného materiálu
# 1x xxx.x8 - zpracováno podle zvláštního předpisu
# 1x xxx.x9 - zpracováno podle dohodnutého předpisu

